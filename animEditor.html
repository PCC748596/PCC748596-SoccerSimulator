<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Editor de animação — Soccer Simulator</title>
    <!--
    =========================================================================
    EDITOR DE ANIMAÇÃO
    =========================================================================
    Spec em docs/superpowers/specs/2026-08-25-editor-de-animacao-design.md.

    Os gestos do jogo são clips de keyframes escritos à mão no js/config.js,
    em radianos. Afiná-los era escrever números às cegas e recarregar o jogo à
    espera de ver o lance passar.

    O QUE ESTA PÁGINA NÃO FAZ: não carrega o match.js, o player.js, os BTs nem
    a FSM. Só precisa do config.js (onde vivem os clips) e do pose.js (onde
    vivem o corpo e as poses).

    E É ESSE O PONTO: as poses aqui são as MESMAS funções que o jogo chama.
    Se o editor tivesse a sua própria leitura dos ângulos, afinava-se uma pose
    aqui e no jogo ficava outra — uma ferramenta que mente é pior do que não
    ter ferramenta.

    FICA DE FORA a animação procedural: a passada, as camadas do peito e do
    cabeceio, o reach/IK e o mergulho do guarda-redes não têm keyframes.
    =========================================================================
    -->
    <style>
        :root {
            --fundo: #14161a;
            --painel: #1c1f26;
            --linha: #2b303a;
            --texto: #e8eaed;
            --suave: #9aa3b2;
            --realce: #3498db;
            --contacto: #e74c3c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--fundo);
            color: var(--texto);
            font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #cena { flex: 1; position: relative; min-width: 0; }
        #cena canvas { display: block; }

        #dica {
            position: absolute; left: 12px; bottom: 12px;
            color: var(--suave); font-size: 12px;
            background: rgba(0, 0, 0, .45); padding: 6px 10px; border-radius: 4px;
        }

        #painel {
            width: 380px; background: var(--painel);
            border-left: 1px solid var(--linha);
            display: flex; flex-direction: column;
        }

        .seccao { padding: 10px 12px; border-bottom: 1px solid var(--linha); }
        .seccao h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--suave); letter-spacing: .06em; }

        select, button {
            background: #262b34; color: var(--texto);
            border: 1px solid var(--linha); border-radius: 4px;
            padding: 6px 10px; font: inherit; cursor: pointer;
        }
        button:hover { border-color: var(--realce); }
        button.activo { background: var(--realce); border-color: var(--realce); color: #06202f; }
        select { width: 100%; }

        .linha-botoes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

        /* Linha do tempo */
        #frames { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 8px; }
        .frame {
            width: 30px; height: 28px; border-radius: 3px;
            background: #262b34; border: 1px solid var(--linha);
            color: var(--suave); font-size: 11px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .frame.actual { background: var(--realce); color: #06202f; border-color: var(--realce); }
        /* O frame do contacto: é onde a bola sai do pé. Mexer numa pose sem
           saber onde ele está é meio caminho para estragar o timing. */
        .frame.contacto { border-color: var(--contacto); border-width: 2px; }

        /* Sliders */
        #canais { overflow-y: auto; flex: 1; padding: 4px 12px 16px; }
        .canal { margin: 10px 0 0; }
        .canal-topo { display: flex; justify-content: space-between; align-items: baseline; }
        .canal-nome { font-weight: 600; }
        .canal-valor {
            font-variant-numeric: tabular-nums; color: var(--realce);
            background: #262b34; border: 1px solid var(--linha); border-radius: 3px;
            width: 74px; text-align: right; padding: 2px 5px; font: inherit;
        }
        .canal input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--realce); }
        /* A legenda do sinal: é o que responde a "não percebo os números". */
        .canal-legenda { color: var(--suave); font-size: 11px; }
        .canal.mudado .canal-nome::after { content: " •"; color: var(--contacto); }

        #estado { padding: 8px 12px; color: var(--suave); font-size: 12px; border-top: 1px solid var(--linha); }
        #saida {
            width: 100%; height: 150px; background: #0f1115; color: #cfd6e4;
            border: 1px solid var(--linha); border-radius: 4px; padding: 8px;
            font: 11px/1.4 ui-monospace, Consolas, monospace; display: none;
        }
    </style>
</head>

<body>
    <div id="cena">
        <div id="dica">
            clicar num membro: seleccionar &nbsp;·&nbsp; arrastar os anéis: rodar a junta<br>
            arrastar o fundo: orbitar &nbsp;·&nbsp; roda: aproximar &nbsp;·&nbsp; Ctrl+Z: desfazer
        </div>
    </div>

    <div id="painel">
        <div class="seccao" style="padding-bottom:0">
            <div class="linha-botoes" id="abas">
                <button id="aba-clips" class="activo">Clips</button>
                <button id="aba-passada">Passada</button>
            </div>
        </div>

        <div class="seccao" id="painel-clips">
            <h2>Clip</h2>
            <select id="sel-clip"></select>
            <div class="linha-botoes" style="margin-top:8px">
                <button id="btn-play">▶ play</button>
                <button id="btn-loop" class="activo">loop</button>
                <button id="btn-fantasma" class="activo">fantasma</button>
            </div>
            <div id="frames"></div>
        </div>

        <!--
        PASSADA: andar, trotar e correr não são clips. São fórmulas com senos
        (getGaitPose, js/utils.js) alimentadas pelas constantes do GaitModel,
        portanto não há keyframes para arrastar — o que se afina é a amplitude
        da coxa, quanto o joelho oscila, os metros por passada. Daí um painel
        de constantes e o boneco em ciclo contínuo, em vez de linha do tempo.
        -->
        <div class="seccao" id="painel-passada" style="display:none">
            <h2>Passada</h2>
            <div class="canal">
                <div class="canal-topo">
                    <span class="canal-nome">velocidade</span>
                    <input class="canal-valor" id="vel-valor" type="number" step="0.1" value="4.5">
                </div>
                <input type="range" id="vel-slider" min="0" max="9" step="0.1" value="4.5">
                <div class="canal-legenda">
                    m/s — o andamento sai daqui, misturado entre andar, trote e correr
                </div>
            </div>
            <div class="linha-botoes" style="margin-top:8px">
                <button data-vel="1.8">andar</button>
                <button data-vel="4.5">trote</button>
                <button data-vel="7.2">correr</button>
            </div>
        </div>

        <div class="seccao" style="padding-bottom:6px">
            <h2 id="titulo-canais">Canais</h2>
        </div>
        <div id="canais"></div>

        <div class="seccao">
            <div class="linha-botoes">
                <button id="btn-copiar">Copiar clip</button>
                <button id="btn-undo" disabled>↶ desfazer</button>
                <button id="btn-repor">Repor</button>
            </div>
            <textarea id="saida" spellcheck="false"></textarea>
        </div>
        <div id="estado">a carregar…</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!--
    Gizmo de rotação, para se poder agarrar num membro em vez de procurar o
    slider. É o TransformControls da MESMA versão do three (r128) — misturar
    versões dá erros que só aparecem ao arrastar.
    -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <!-- Só isto: os clips e as poses. Nada do jogo. -->
    <script src="js/config.js"></script>
    <!-- getGaitPose e lerpTo: o ciclo da passada vive aqui. -->
    <script src="js/utils.js"></script>
    <script src="js/pose.js"></script>
    <script src="js/animEditor.js"></script>
</body>

</html>
